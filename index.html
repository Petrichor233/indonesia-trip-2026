function todayISO() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
}
function parseISO(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); }
function diffDays(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }

function currentDay() {
  const iso = todayISO();
  const found = days.find(d => d.iso === iso);
  if (found) return { mode:"during", day: found };
  if (iso < days[0].iso) return { mode:"before", day: days[0], left: diffDays(iso, days[0].iso) };
  return { mode:"after", day: days[days.length - 1] };
}

function nextEvent(day) {
  if (!day) return null;
  const now = new Date();
  const iso = todayISO();
  if (day.iso !== iso) return day.events[0];
  const hm = now.getHours()*60 + now.getMinutes();
  for (const e of day.events) {
    if (e.t === "全天") continue;
    const [h,m] = e.t.split(":").map(Number);
    if (h*60 + m >= hm - 20) return e;
  }
  return day.events[day.events.length - 1];
}

function dayMeta(d) {
  return `
    <div class="kv"><b>住</b>${d.stay || ""}</div>
    <div class="kv"><b>早</b>${d.breakfast || ""}</div>
    <div class="kv"><b>交通</b>${d.flight || ""}</div>`;
}

function eventRows(events) {
  return events.map(e => `
    <div class="row">
      <div class="t">${e.t}</div>
      <div>
        <div class="title">${e.title} ${e.kind==="skip"?'<span class="chip chip-skip">可放弃</span>':''}</div>
        ${e.note?`<div class="note ${e.kind==="hl"?"hl":e.kind==="must"?"memo":""}">${e.note}</div>`:""}
      </div>
    </div>`).join("");
}

  const markers = {};
  stops.forEach(s => {
    const m = L.marker([s.lat, s.lng], { icon: L.divIcon({ className:"", html:`<div class="marker-num" style="background:${PHASE_COLOR[s.phase]}">${s.id+1}</div>`, iconSize:[26,26], iconAnchor:[13,13] }) })
      .addTo(mapObj)
      .bindPopup(`<b>${s.name}</b><br>${s.date}<br>${s.desc}`);
    markers[s.id] = m;
  });
  function draw(from, to, type) {
    const a = stops.find(x=>x.id===from), b = stops.find(x=>x.id===to);
    if (!a || !b) return;
    L.polyline([[a.lat,a.lng],[b.lat,b.lng]], {
      color: type==="flight" ? "#2563eb" : (PHASE_COLOR[b.phase]||"#0f766e"),
      weight: type==="flight"?2:3, dashArray: type==="flight"?"8 6":null, opacity:.75
    }).addTo(mapObj);
  }
  flightSegs.forEach(([f,t]) => draw(f,t,"flight"));
  groundSegs.forEach(([f,t]) => draw(f,t,"ground"));
  mapObj.fitBounds(L.latLngBounds(stops.slice(2).map(s=>[s.lat,s.lng])).pad(.12));
}

function sid() {
  const q = new URLSearchParams(location.search).get("sid");
  return (q || localStorage.getItem(KEY_SID) || "").trim();
}
function blobUrl(id) { return "https://jsonblob.com/api/jsonBlob/" + id; }
function who() { return localStorage.getItem(KEY_WHO) || ""; }

async function hashPin(pin) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("island-volcano-2026|" + pin));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function setSid(id) {
  localStorage.setItem(KEY_SID, id);
  const u = new URL(location.href);
  u.searchParams.set("sid", id);
  history.replaceState({}, "", u);
}

async function pullCloud() {
  const id = sid();
  if (!id) return false;
  const r = await fetch(blobUrl(id), { headers: { Accept: "application/json" } });
  if (!r.ok) throw new Error("读取失败 " + r.status);
  cloud = Object.assign({ prep: {}, pack: {}, notes: "", pinHash: "", updatedAt: "", by: "" }, await r.json());
  return true;
}

async function pushCloud() {
  const id = sid();
  if (!id) return;
  cloud.updatedAt = new Date().toISOString();
  cloud.by = who() || "未署名";
  const r = await fetch(blobUrl(id), {
    method: "PUT",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify(cloud)
  });
  if (!r.ok) throw new Error("保存失败 " + r.status);
}

async function createCloud() {
  const body = JSON.stringify({ prep: {}, pack: {}, notes: "", pinHash: "", updatedAt: "", by: "" });
  const r = await fetch("https://jsonblob.com/api/jsonBlob", {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body
  });
  if (!r.ok) throw new Error("创建失败 " + r.status);
  const loc = r.headers.get("Location") || r.headers.get("location") || "";
  const headerId = r.headers.get("X-jsonBlob") || r.headers.get("x-jsonblob") || "";
  const id = headerId || (loc.match(/jsonBlob\/([^/?#]+)/) || [])[1];
  if (!id) throw new Error("没有拿到同步码");
  setSid(id);
  cloud = { prep: {}, pack: {}, notes: "", pinHash: "", updatedAt: "", by: "" };
}

function shareLink() {
  const u = new URL(location.href);
  if (sid()) u.searchParams.set("sid", sid());
  return u.toString();
}

function schedulePush() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    pushCloud().then(() => renderSyncBits()).catch(err => alert(err.message));
  }, 500);
}

function renderSyncBits() {
  document.querySelectorAll("[data-sync]").forEach(el => {
    el.textContent = cloud.updatedAt
      ? `上次由 ${cloud.by || "?"} 更新于 ${cloud.updatedAt.replace("T", " ").slice(0, 16)}`
      : "还没有云端记录";
  });
}

function gateCard() {
  const unlocked = canEdit ? `<p class="okline">已解锁，勾选和备忘会同步给对方。</p>` : "";
  return `
    <div class="card">
      <div class="kicker">情侣同步</div>
      <div class="title" style="margin:6px 0">${sid() ? "已连接云端" : "还没有共享本"}</div>
      <p class="hint">你们两人用同一个链接 + 同一口令。朋友没有口令只能看行程和勾选进度，不能改。不要把护照号、证件扫描写进来。</p>
      <input class="field" id="whoBox" placeholder="你的称呼，例如 小冉 / 对象" value="${who()}">
      <input class="field" id="pinBox" type="password" placeholder="情侣口令（两人设成一样）">
      <div class="bar">
        ${sid() ? `<button class="btn" id="btnUnlock">解锁编辑</button>` : `<button class="btn" id="btnCreate">创建共享并解锁</button>`}
        ${sid() ? `<button class="btn sec" id="btnCopy">复制情侣链接</button>` : ""}
      </div>
      ${unlocked}
      <p class="hint" data-sync></p>
      <p class="err" id="syncErr"></p>
    </div>`;
}

function bindGate(box) {
  const whoBox = box.querySelector("#whoBox");
  if (whoBox) whoBox.onchange = () => localStorage.setItem(KEY_WHO, whoBox.value.trim());
  const err = (m) => { const el = box.querySelector("#syncErr"); if (el) el.textContent = m; };
  const afterUnlock = async () => {
    sessionStorage.setItem(KEY_UNLOCK, "1");
    canEdit = true;
    renderPrep();
    renderNote();
  };
  const btnCreate = box.querySelector("#btnCreate");
  if (btnCreate) btnCreate.onclick = async () => {
    try {
      const pin = (box.querySelector("#pinBox").value || "").trim();
      const name = (box.querySelector("#whoBox").value || "").trim();
      if (!name) return err("先填称呼");
      if (pin.length < 4) return err("口令至少 4 位");
      localStorage.setItem(KEY_WHO, name);
      await createCloud();
      canEdit = true;
      cloud.pinHash = await hashPin(pin);
      await pushCloud();
      await afterUnlock();
    } catch (e) { err(e.message + "。若在国内打不开，把报错发给我换存储。"); }
  };
  const btnUnlock = box.querySelector("#btnUnlock");
  if (btnUnlock) btnUnlock.onclick = async () => {
    try {
      const pin = (box.querySelector("#pinBox").value || "").trim();
      const name = (box.querySelector("#whoBox").value || "").trim();
      if (!name) return err("先填称呼");
      if (!pin) return err("输入口令");
      localStorage.setItem(KEY_WHO, name);
      await pullCloud();
      const h = await hashPin(pin);
      if (cloud.pinHash && cloud.pinHash !== h) return err("口令不对");
      if (!cloud.pinHash) { cloud.pinHash = h; await pushCloud(); }
      await afterUnlock();
    } catch (e) { err(e.message); }
  };
  const btnCopy = box.querySelector("#btnCopy");
  if (btnCopy) btnCopy.onclick = async () => {
    try { await navigator.clipboard.writeText(shareLink()); btnCopy.textContent = "已复制"; }
    catch { prompt("复制这个链接发给对方", shareLink()); }
  };
  renderSyncBits();
}

function renderPrep() {
  const st = cloud.prep || {};
  const pk = cloud.pack || {};
  const groups = [...new Set(prep.map(p=>p.g))];
  const bgroups = [...new Set(bags.map(p=>p.g))];
  const box = document.getElementById("page-prep");
  const left = prep.filter(p=>!st[p.id]).length;
  const leftB = bags.filter(p=>!pk[p.id]).length;
  box.innerHTML = gateCard() + `
    <div class="card">
      <div class="kicker">行前待办</div>
      <div class="next" style="font-size:18px">预订还剩 ${left} / ${prep.length} · 行李还剩 ${leftB} / ${bags.length}</div>
      <p class="hint">${canEdit ? "勾选会立刻同步到云端。" : "先解锁才能勾选。"}</p>
    </div>
    ${groups.map(g=>`
      <div class="card">
        <div class="kicker">${g}</div>
        ${prep.filter(p=>p.g===g).map(p=>`
          <label class="check ${st[p.id]?"done":""}">
            <input type="checkbox" data-list="prep" data-id="${p.id}" ${st[p.id]?"checked":""} ${canEdit?"":"disabled"}>
            <span class="lab">${p.t}</span>
          </label>`).join("")}
      </div>`).join("")}
    <div class="card">
      <div class="kicker">行李整理</div>
      <div class="title" style="margin:6px 0">按阶段打包，避免一个箱子翻到底</div>
      <p class="hint">科莫多 / 冲浪 / 潜水 / 火山分袋。9.27、9.30、10.01、10.03、10.04 换酒店勤，随身包精简。</p>
    </div>
    ${bgroups.map(g=>`
      <div class="card">
        <div class="kicker">行李 · ${g}</div>
        ${bags.filter(p=>p.g===g).map(p=>`
          <label class="check ${pk[p.id]?"done":""}">
            <input type="checkbox" data-list="pack" data-id="${p.id}" ${pk[p.id]?"checked":""} ${canEdit?"":"disabled"}>
            <span class="lab">${p.t}</span>
          </label>`).join("")}
      </div>`).join("")}`;
  bindGate(box);
  box.querySelectorAll("input[type=checkbox]").forEach(inp => inp.onchange = () => {
    const list = inp.dataset.list;
    cloud[list] = cloud[list] || {};
    cloud[list][inp.dataset.id] = inp.checked;
    renderPrep();
    schedulePush();
  });
}

function renderNote() {
  const box = document.getElementById("page-note");
  box.innerHTML = gateCard() + `
    <div class="card">
      <div class="kicker">共享备忘</div>
      <p class="hint">${canEdit ? "两人看到的是同一份。不要写护照号、证件号。" : "解锁后可编辑。"}</p>
      <textarea id="noteBox" placeholder="花费分摊、潜店 WhatsApp、明早谁带口罩……" ${canEdit?"":"disabled"}></textarea>
    </div>
    <div class="card">
      <div class="kicker">给朋友看的公开说明</div>
      <p class="note">路线、每天几点干什么、哪些项目可以放弃。不含证件号和订单号。</p>
      <p class="note" style="margin-top:8px">体力瓶颈：10.04–10.06。可放弃：9.30下午冲浪、10.04追海豚、10.06赛武深入玩水。</p>
      <p class="note" style="margin-top:8px">OW 考证：图兰本 10.02–10.03，建议中文教练 + 出发前用中文 eLearning。</p>
    </div>`;
  bindGate(box);
  const ta = document.getElementById("noteBox");
  ta.value = cloud.notes || "";
  ta.oninput = () => { cloud.notes = ta.value; schedulePush(); };
}

document.querySelectorAll("nav button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("nav button").forEach(b=>b.classList.remove("on"));
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
    btn.classList.add("on");
    document.getElementById("page-"+btn.dataset.page).classList.add("on");
    window.scrollTo(0,0);
    if (btn.dataset.page === "map") renderMap();
  };
});

try { renderToday(); } catch (e) { document.getElementById("page-today").innerHTML = '<div class="card">今日页加载失败，请点「行程」查看。</div>'; }
try { renderTrip(); } catch (e) {}

(async () => {
  try {
    if (sid()) {
      localStorage.setItem(KEY_SID, sid());
      await pullCloud();
      if (sessionStorage.getItem(KEY_UNLOCK) === "1") canEdit = true;
    }
  } catch (e) { console.warn(e); }
  try { renderPrep(); } catch (e) {}
  try { renderNote(); } catch (e) {}
  setInterval(async () => {
    if (syncing || document.hidden || !sid()) return;
    if (document.activeElement && document.activeElement.id === "noteBox") return;
    syncing = true;
    try {
      const prev = JSON.stringify(cloud);
      await pullCloud();
      if (JSON.stringify(cloud) !== prev) { renderPrep(); renderNote(); }
    } catch (e) {}
    syncing = false;
  }, 8000);
})();
</script>
