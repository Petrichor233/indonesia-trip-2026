      --bali: #0369a1;
      --java: #b91c1c;
      --warn: #c2410c;

    .chip-java { background: #fee2e2; color: var(--java); }

    .chip-skip { background: #ffedd5; color: var(--warn); }
    .chip-must { background: #dcfce7; color: var(--ok); }
    .chip-ok { background: #dcfce7; color: var(--ok); }
    .chip-wait { background: #ffedd5; color: var(--warn); }

    .warn {

    .row:first-of-type { border-top: none; }
    .t { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); padding-top: 2px; }
    .title { font-weight: 600; font-size: 14px; }
    .note { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .hl { color: var(--warn); }
    .memo { color: var(--ok); }

    .subnav {

      border-bottom: 1px solid var(--line);

      text-decoration: underline;

      text-decoration-thickness: 1px;
      -webkit-tap-highlight-color: transparent;

    .pack-st:disabled { opacity: 1; cursor: default; }

    .hint { font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
    .btn {

    .field {

    nav {

    .marker-num {

      nav {

        border-bottom: 1px solid var(--line);
        padding-bottom: 0;
      }

      .subnav { top: 0; }

  </style>
</head>

const phaseChip = p => `<span class="chip chip-${p}">${phaseName[p]}</span>`;
function statusChip(s) {
  if (s==="ok") return '<span class="chip chip-ok">已确认</span>';
  if (s==="wait") return '<span class="chip chip-wait">待预订</span>';
  if (s==="cancel") return '<span class="chip chip-off">已退订</span>';
  if (s==="canceling") return '<span class="chip chip-wait">待退订</span>';
  return "";
}
function isChecked(list, item) {
  const st = cloud[list] || {};
  if (Object.prototype.hasOwnProperty.call(st, item.id)) return !!st[item.id];
  return !!item.done;
}
function packState(item) {
  const raw = (cloud.pack || {})[item.id];
  if (raw === "none" || raw === "have" || raw === "packed") return raw;
  if (raw === true) return "have";
  if (raw === false) return "none";
  return item.st || "none";
}
function nextPackState(cur) {
  return PACK_CYCLE[(PACK_CYCLE.indexOf(cur) + 1) % PACK_CYCLE.length];
}
function seedDefaults() {
  const prepSt = {}, packSt = {};
  prep.forEach(p => { if (p.done) prepSt[p.id] = true; });
  bags.forEach(p => { packSt[p.id] = p.st || "none"; });
  return { prep: prepSt, pack: packSt };
}

function todayISO() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
}
function parseISO(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); }
function diffDays(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }

function currentDay() {
  const iso = todayISO();
  const found = days.find(d => d.iso === iso);
  if (found) return { mode:"during", day: found };
  if (iso < days[0].iso) return { mode:"before", day: days[0], left: diffDays(iso, days[0].iso) };
  return { mode:"after", day: days[days.length - 1] };
}

function nextEvent(day) {
  if (!day) return null;
  const now = new Date();
  const iso = todayISO();
  if (day.iso !== iso) return day.events[0];
  const hm = now.getHours()*60 + now.getMinutes();
  for (const e of day.events) {
    if (!/^\d{1,2}:\d{2}$/.test(e.t)) continue;
    const [h,m] = e.t.split(":").map(Number);
    if (h*60 + m >= hm - 20) return e;
  }
  return day.events[day.events.length - 1];
}

function dayMeta(d) {
  let stay = d.stay || "";
  hotels.filter(h => !["cancel","canceling"].includes(h.status) && hotelOnDay(h, d)).forEach(h => {
    const short = h.name.replace(/（.*）/, "").trim();
    const id = "h-" + hotels.indexOf(h);
    if (short && stay.includes(short)) stay = stay.split(short).join(tap(short, "hotels", id));
  });
  acts.filter(a => actOnDay(a, d)).forEach(a => {
    if (stay.includes(a.name)) stay = stay.split(a.name).join(tap(a.name, "acts", "a-"+acts.indexOf(a)));
  });
  return `
    <div class="kv"><b>住</b>${stay}</div>
    <div class="kv"><b>早</b>${d.breakfast || ""}</div>
    <div class="kv"><b>交通</b>${linkFlights(d.flight || "")}</div>`;
}

function tap(text, jump, id) {
  return `<span class="tap" data-jump="${jump}" data-id="${id || ""}">${text}</span>`;
}
function linkFlights(s) {
  let out = s || "";
  flights.forEach(f => { out = out.split(f.no).join(tap(f.no, "flights", "f-"+f.no)); });
  return out;
}
function linkActs(s) {
  let out = s || "";
  [...acts].sort((a,b) => b.name.length - a.name.length).forEach(a => {
    if (out.includes(a.name)) out = out.split(a.name).join(tap(a.name, "acts", "a-"+acts.indexOf(a)));
  });
  return out;
}

function md(s) {
  const m = String(s).match(/(\d{1,2})\.(\d{1,2})/);
  return m ? Number(m[1]) * 100 + Number(m[2]) : 0;
}
function hotelOnDay(h, d) {
  const x = md(d.date);
  return md(h.inn) <= x && x < md(h.out);
}
function actOnDay(a, d) {
  const keys = String(a.date).match(/(\d{1,2})\.(\d{1,2})/g) || [];
  const x = md(d.date);
  if (keys.length >= 2) return md(keys[0]) <= x && x <= md(keys[1]);
  return keys.some(k => md(k) === x);
}
function dayIndexForDate(s) {
  const k = md(s);
  const i = days.findIndex(d => md(d.date) === k);
  return i < 0 ? 0 : i;
}

function eventRows(events) {
  return events.map(e => `
    <div class="row">
      <div class="t">${e.t}</div>
      <div>
        <div class="title">${linkActs(linkFlights(e.title))} ${e.kind==="skip"?'<span class="chip chip-skip">可放弃</span>':''}</div>
        ${e.note?`<div class="note ${e.kind==="hl"?"hl":e.kind==="must"?"memo":""}">${linkActs(linkFlights(e.note))}</div>`:""}
      </div>
    </div>`).join("");
}

function flightBlock(f) {
  const dayId = "day-" + dayIndexForDate(f.date);
  return `<div class="flight" id="f-${f.no}">
    <div class="title">${tap(f.date, "days", dayId)} ${tap(f.no, "flights", "f-"+f.no)} · ${f.route}</div>
    <div class="note memo">${f.al} · ${f.dep} → ${f.arr} · ${f.bag}</div>
    <div class="note">${f.book}${f.note?" · "+f.note:""}</div>

}

function boatIcon(color) {
  return L.divIcon({ className:"", html:`<div class="marker-dot" style="background:${color}"></div>`, iconSize:[10,10], iconAnchor:[5,5] });
}
function addBoatRoute(pts, color, title) {
  pts.forEach(p => {
    L.marker([p.lat, p.lng], { icon: boatIcon(color), zIndexOffset: -100 })
      .addTo(mapObj)
      .bindPopup(`<b>${p.name}</b><br>${title}`);
  });
  L.polyline(pts.map(p => [p.lat, p.lng]), {
    color, weight: 1.5, dashArray: "3 5", opacity: .85
  }).addTo(mapObj);
}
function regionPoints(key) {
  if (key === "komodo") {
    return [
      stops.find(s => s.id === 3),
      ...boatHalf, ...boatDay
    ].map(p => [p.lat, p.lng]);
  }
  if (key === "bali") return stops.filter(s => s.phase === "bali" || s.name === "Gilimanuk").map(s => [s.lat, s.lng]);
  if (key === "java") return stops.filter(s => s.phase === "java").map(s => [s.lat, s.lng]);
  return [];
}
function focusRegion(key) {
  const run = () => {
    if (!mapObj) return;
    const pts = regionPoints(key);
    if (!pts.length) return;
    mapObj.flyToBounds(L.latLngBounds(pts).pad(0.22), { duration: 0.7 });
  };
  if (!mapObj) setTimeout(run, 160);
  else run();
}
function initMap() {
  const el = document.getElementById("map");
  if (!el || typeof L === "undefined") return;
  if (mapObj) { mapObj.invalidateSize(); return; }
  mapObj = L.map(el, { zoomControl:true, scrollWheelZoom:true }).setView([-8.3, 115.2], 7);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", { attribution:"&copy; OSM &copy; CARTO", maxZoom:18 }).addTo(mapObj);
  stops.forEach((s,i) => {
    L.marker([s.lat, s.lng], { icon: L.divIcon({ className:"", html:`<div class="marker-num" style="background:${PHASE_COLOR[s.phase]}">${i+1}</div>`, iconSize:[26,26], iconAnchor:[13,13] }) })
      .addTo(mapObj)
      .bindPopup(`<b>${s.name}</b><br>${s.date}<br>${s.desc}`);
  });
  function draw(from, to, type) {
    const a = stops.find(x=>x.id===from), b = stops.find(x=>x.id===to);
    if (!a || !b) return;
    L.polyline([[a.lat,a.lng],[b.lat,b.lng]], {
      color: type==="flight" ? "#2563eb" : (PHASE_COLOR[b.phase]||"#0f766e"),
      weight: type==="flight"?2:3, dashArray: type==="flight"?"8 6":null, opacity:.75
    }).addTo(mapObj);
  }
  flightSegs.forEach(([f,t]) => draw(f,t,"flight"));
  groundSegs.forEach(([f,t]) => draw(f,t,"ground"));
  addBoatRoute(boatHalf, "#0f766e", "9.27 科莫多半日游");
  addBoatRoute(boatDay, "#14b8a6", "9.28 科莫多一日跳岛");
  mapObj.fitBounds(L.latLngBounds(stops.filter(s=>s.phase!=="transit"||s.name==="Gilimanuk").map(s=>[s.lat,s.lng])).pad(.12));
}

const CLOUD_API = "https://api.textdb.online";

function sid() {
  const q = new URLSearchParams(location.search).get("sid");
  return (q || localStorage.getItem(KEY_SID) || "").trim();
}
function isTextDbSid(id) { return /^td[a-f0-9]{16}$/i.test(id || ""); }
function who() { return localStorage.getItem(KEY_WHO) || ""; }
function newCloudKey() {
  const bytes = new Uint8Array(8);
  crypto.getRandomValues(bytes);
  return "td" + [...bytes].map(b => b.toString(16).padStart(2, "0")).join("");
}
function syncFailHint(e) {
  const raw = (e && e.message) ? e.message : String(e);
  return raw + "。若仍打不开，把这句原样发给我换存储。";
}

async function hashPin(pin) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("island-volcano-2026|" + pin));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function setSid(id) {
  localStorage.setItem(KEY_SID, id);
  const u = new URL(location.href);
  u.searchParams.set("sid", id);
  history.replaceState({}, "", u);
}

function clearSid() {
  localStorage.removeItem(KEY_SID);
  sessionStorage.removeItem(KEY_UNLOCK);
  canEdit = false;
  cloud = { prep: {}, pack: {}, notes: "", pinHash: "", updatedAt: "", by: "" };
  const u = new URL(location.href);
  u.searchParams.delete("sid");
  history.replaceState({}, "", u);
}

async function cloudFetch(url, opts) {
  try {
    return await fetch(url, opts);
  } catch (e) {
    const raw = (e && e.message) ? e.message : String(e);
    throw new Error(raw + " @ " + CLOUD_API);
  }
}

async function writeCloud(id, data) {
  const body = new URLSearchParams();
  body.set("key", id);
  body.set("value", JSON.stringify(data));
  const r = await cloudFetch(CLOUD_API + "/update/", { method: "POST", body });
  if (!r.ok) throw new Error("保存失败 HTTP " + r.status + " @ " + CLOUD_API);
  let j = {};
  try { j = await r.json(); } catch (e) { throw new Error("保存失败：返回不是 JSON @ " + CLOUD_API); }
  if (!j || j.status !== 1) throw new Error("保存失败 " + ((j && (j.info || j.msg)) || JSON.stringify(j)) + " @ " + CLOUD_API);
}

async function pullCloud() {
  const id = sid();
  if (!id) return false;
  if (!isTextDbSid(id)) throw new Error("旧同步通道 jsonblob 国内打不开，请点「重新创建共享」");
  const r = await cloudFetch(CLOUD_API + "/" + encodeURIComponent(id));
  if (!r.ok) throw new Error("读取失败 HTTP " + r.status + " @ " + CLOUD_API);
  const text = ((await r.text()) || "").trim();
  if (!text) throw new Error("云端还没有这份数据，请重新创建共享 @ " + CLOUD_API);
  let data;
  try { data = JSON.parse(text); }
  catch (e) { throw new Error("云端数据损坏 @ " + CLOUD_API); }
  cloud = Object.assign({ prep: {}, pack: {}, notes: "", pinHash: "", updatedAt: "", by: "" }, data);
  return true;
}

async function pushCloud() {
  const id = sid();
  if (!id) return;
  if (!isTextDbSid(id)) throw new Error("旧同步通道 jsonblob 国内打不开，请点「重新创建共享」");
  cloud.updatedAt = new Date().toISOString();
  cloud.by = who() || "同伴";
  await writeCloud(id, cloud);
}

async function createCloud() {
  const seeded = seedDefaults();
  const id = newCloudKey();
  const data = { prep: seeded.prep, pack: seeded.pack, notes: "", pinHash: "", updatedAt: "", by: "" };
  await writeCloud(id, data);
  setSid(id);
  cloud = data;
}

function shareLink() {
  const u = new URL(location.href);
  if (sid()) u.searchParams.set("sid", sid());
  return u.toString();
}

function schedulePush() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    pushCloud().then(() => renderSyncBits()).catch(err => alert(err.message));
  }, 500);
}

function renderSyncBits() {
  document.querySelectorAll("[data-sync]").forEach(el => {
    el.textContent = cloud.updatedAt
      ? `上次由 ${cloud.by || "?"} 更新于 ${cloud.updatedAt.replace("T", " ").slice(0, 16)}`
      : "还没有云端记录";
  });
}

function gateCard() {
  const id = sid();
  const legacy = id && !isTextDbSid(id);
  const connected = id && !legacy;
  const unlocked = canEdit ? `<p class="okline">已解锁，勾选会同步给对方。</p>` : "";
  const title = legacy ? "旧通道失效" : (connected ? "已连接" : "未创建共享");
  return `
    <div class="card gate-card">
      <div class="kicker">同伴同步 · ${title}</div>
      <input class="field" id="pinBox" type="password" placeholder="同伴口令">
      <div class="bar">
        ${legacy ? `<button class="btn" id="btnReset">重新创建</button>` : (connected ? `<button class="btn" id="btnUnlock">解锁编辑</button>` : `<button class="btn" id="btnCreate">创建并解锁</button>`)}
        ${connected ? `<button class="btn sec" id="btnCopy">复制链接</button>` : ""}
      </div>
      ${unlocked}
      <p class="hint" data-sync></p>
      <p class="err" id="syncErr">${legacy ? "旧码无法读取，请重新创建。" : ""}</p>
    </div>`;
}

function bindGate(box) {
  const err = (m) => { const el = box.querySelector("#syncErr"); if (el) el.textContent = m; };
  const afterUnlock = async () => {
    sessionStorage.setItem(KEY_UNLOCK, "1");
    canEdit = true;
    renderPrep();
  };
  const btnCreate = box.querySelector("#btnCreate");
  if (btnCreate) btnCreate.onclick = async () => {
    try {
      const pin = (box.querySelector("#pinBox").value || "").trim();
      if (pin.length < 4) return err("口令至少 4 位");
      await createCloud();
      canEdit = true;
      cloud.pinHash = await hashPin(pin);
      await pushCloud();
      await afterUnlock();
    } catch (e) { err(syncFailHint(e)); }
  };
  const btnReset = box.querySelector("#btnReset");
  if (btnReset) btnReset.onclick = () => {
    clearSid();
    renderPrep();
  };
  const btnUnlock = box.querySelector("#btnUnlock");
  if (btnUnlock) btnUnlock.onclick = async () => {
    try {
      const pin = (box.querySelector("#pinBox").value || "").trim();
      if (!pin) return err("输入口令");
      await pullCloud();
      const h = await hashPin(pin);
      if (cloud.pinHash && cloud.pinHash !== h) return err("口令不对");
      if (!cloud.pinHash) { cloud.pinHash = h; await pushCloud(); }
      await afterUnlock();
    } catch (e) { err(syncFailHint(e)); }
  };
  const btnCopy = box.querySelector("#btnCopy");
  if (btnCopy) btnCopy.onclick = async () => {
    try { await navigator.clipboard.writeText(shareLink()); btnCopy.textContent = "已复制"; }
    catch { prompt("复制这个链接发给对方", shareLink()); }
  };
  renderSyncBits();
}

function renderPrep() {
  const groups = [...new Set(prep.map(p=>p.g))];
  const bgroups = [...new Set(bags.map(p=>p.g))];
  const box = document.getElementById("page-prep");
  const left = prep.filter(p=>!isChecked("prep", p)).length;
  const noneN = bags.filter(p => packState(p) === "none").length;
  const haveN = bags.filter(p => packState(p) === "have").length;
  const packedN = bags.filter(p => packState(p) === "packed").length;
  const tabs = [
    { id:"todo", label:"待办" },
    { id:"pack", label:"行李" },
    { id:"note", label:"备忘" }
  ];
  const todoBody = `
    <div class="card">
      <div class="kicker">行前待办</div>
      <div class="next" style="font-size:18px">待办还剩 ${left} / ${prep.length}</div>
      <p class="hint">${canEdit ? "勾选会立刻同步到云端。已完成项已预勾。" : "先解锁才能勾选。已买行李额、已退 Seamount、已订烹饪课会显示完成。"}</p>
    </div>
    <div class="card">
      <div class="kicker">签证与入境</div>
      <p class="note">印尼：需 e-VOA（2025年11月起对中国不免签），约 IDR 500,000/人，官网 molina.imigrasi.go.id</p>
      <p class="note" style="margin-top:6px">马来西亚：免签，出发前 72 小时内填 MDAC。</p>
      <p class="note" style="margin-top:6px">越南：胡志明中转不出机场无需签证；联程行李直挂。</p>
    </div>
    ${groups.map(g=>`
      <div class="card">
        <div class="kicker">${g}</div>
        ${prep.filter(p=>p.g===g).map(p=>`
          <label class="check ${isChecked("prep",p)?"done":""}">
            <input type="checkbox" data-list="prep" data-id="${p.id}" ${isChecked("prep",p)?"checked":""} ${canEdit?"":"disabled"}>
            <span class="lab">${p.t}</span>
          </label>`).join("")}
      </div>`).join("")}`;
  const packBody = `
    <div class="card">
      <div class="kicker">行李整理</div>
      <div class="next" style="font-size:18px">尚无 ${noneN} · 已有 ${haveN} · 已装包 ${packedN}</div>
      <p class="hint">${canEdit ? "点一行切换：尚无 → 已有 → 已装包。待购买项目前是尚无。" : "先解锁才能改状态。依次是尚无、已有、已装包。"}</p>
      <p class="hint">换酒店勤的日子：9.27、9.29、9.30、10.1、10.3、10.4、10.5、10.6。</p>
    </div>
    ${bgroups.map(g=>`
      <div class="card">
        <div class="kicker">行李 · ${g}</div>
        ${bags.filter(p=>p.g===g).map(p => {
          const st = packState(p);
          return `<button type="button" class="pack-st st-${st}" data-pack="${p.id}" ${canEdit?"":"disabled"}>
            <span class="st-pill">${PACK_LABEL[st]}</span>
            <span class="lab">${p.t}</span>
          </button>`;
        }).join("")}
      </div>`).join("")}`;
  const noteBody = `
    <div class="card">
      <div class="kicker">共享备忘</div>
      <p class="hint">${canEdit ? "两人看到的是同一份。不要写护照号、证件号。" : "解锁后可编辑。"}</p>
      <textarea id="noteBox" placeholder="花费分摊、潜店 WhatsApp、明早谁带口罩……" ${canEdit?"":"disabled"}></textarea>
    </div>
    <div class="card">
      <div class="kicker">行程亮点</div>
      <p class="note">科莫多龙零距离 · 粉红沙滩跳岛 · 图蓝本自由号 OW 考证 · 宜珍蓝火 · 布罗莫日出</p>
      <p class="note" style="margin-top:8px">体力瓶颈：10.04–10.06。赛武瀑布已取消。不要去已退的 Seamount Amed / 待退的 Ocean Villa。</p>
      <p class="note" style="margin-top:8px">两人：WANG/QI、RAN/WEIJUN。公开页不含护照号。</p>
    </div>`;
  const body = prepTab === "pack" ? packBody : (prepTab === "note" ? noteBody : todoBody);
  box.innerHTML = subTabBar(tabs, prepTab, "n3") + gateCard() + body;
  box.querySelectorAll("[data-sub]").forEach(b => b.onclick = () => { prepTab = b.dataset.sub; window.scrollTo(0,0); renderPrep(); });
  bindGate(box);
  box.querySelectorAll("input[type=checkbox]").forEach(inp => inp.onchange = () => {
    cloud.prep = cloud.prep || {};
    cloud.prep[inp.dataset.id] = inp.checked;
    renderPrep();
    schedulePush();
  });
  box.querySelectorAll("[data-pack]").forEach(btn => btn.onclick = () => {
    if (!canEdit) return;
    const id = btn.dataset.pack;
    const item = bags.find(p => p.id === id);
    cloud.pack = cloud.pack || {};
    cloud.pack[id] = nextPackState(packState(item));
    renderPrep();
    schedulePush();
  });
  const ta = document.getElementById("noteBox");
  if (ta) {
    ta.value = cloud.notes || "";
    ta.oninput = () => { cloud.notes = ta.value; schedulePush(); };
  }
}

document.querySelectorAll("nav > button").forEach(btn => {
  btn.onclick = () => {
    showPage(btn.dataset.page);
    window.scrollTo(0,0);
  };
});

try { renderToday(); } catch (e) { document.getElementById("page-today").innerHTML = '<div class="card">今日页加载失败，请点「行程」查看。</div>'; }
try { renderTrip(); } catch (e) {}

(async () => {
  try {
    if (sid() && isTextDbSid(sid())) {
      localStorage.setItem(KEY_SID, sid());
      await pullCloud();
      if (sessionStorage.getItem(KEY_UNLOCK) === "1") canEdit = true;
    }
  } catch (e) { console.warn(e); }
  try { renderPrep(); } catch (e) {}
  setInterval(async () => {
    if (syncing || document.hidden || !isTextDbSid(sid())) return;
    if (document.activeElement && document.activeElement.id === "noteBox") return;
    syncing = true;
    try {
      const prev = JSON.stringify(cloud);
      await pullCloud();
      if (JSON.stringify(cloud) !== prev) { renderPrep(); }
    } catch (e) {}
    syncing = false;
  }, 8000);
})();
</script>
</body>
</html>
