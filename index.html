<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b5e4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>印尼中秋国庆旅行助手 · 2026.9.25–10.8</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #fff;
      --text: #1a1a1a;
      --muted: #8c8c8c;
      --line: #ececec;
      --accent: #0d9b86;
      --purple: #8b5cf6;
      --orange: #e67e22;
      --blue: #3b82f6;
      --komodo: #0f766e;
      --bali: #e67e22;
      --java: #22c55e;
      --warn: #f97316;
      --ok: #0d9b86;
      --safe: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      font-size: 15px;
      padding-bottom: calc(78px + var(--safe));
    }
    .ico {
      width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em;
      stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    header {
      position: sticky; top: 0; z-index: 2000;
      background: linear-gradient(135deg, #1b5e4a 0%, #2f6b45 46%, #c45c26 100%);
      color: #fff;
      padding: 8px 16px 9px;
      isolation: isolate;
    }
    .app { min-height: 100vh; }
    header .eyebrow {
      font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
      opacity: .82; font-weight: 600; margin-bottom: 1px;
    }
    header h1 { font-size: 18px; font-weight: 800; letter-spacing: .02em; line-height: 1.25; }
    header .dates { font-size: 11px; opacity: .88; margin-top: 2px; }
    .wrap { padding: 14px 14px 8px; max-width: 720px; margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 3px rgba(16,24,40,.04);
    }
    .page-head {
      display: flex; align-items: baseline; gap: 8px;
      margin: 2px 0 12px; font-size: 22px; font-weight: 800;
    }
    .page-head span { font-size: 13px; font-weight: 500; color: var(--muted); }
    .add-pill {
      margin-left: auto; align-self: center; flex-shrink: 0;
      border: 0; background: var(--accent); color: #fff;
      border-radius: 99px; padding: 6px 12px;
      font-size: 13px; font-weight: 700;
      transition: transform .15s ease, filter .15s ease;
    }
    .add-pill:active { transform: scale(.96); filter: brightness(.94); }
    .add-pill:disabled { opacity: .45; }
    .add-box .field { margin-bottom: 8px; }
    .ebtn, .xbtn {
      flex-shrink: 0; border: 0; background: #f3f4f6; color: #4b5563;
      border-radius: 8px; width: 28px; height: 28px; padding: 0; margin-top: 1px;
      font-size: 16px; font-weight: 400; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .xbtn { color: #dc2626; background: #fef2f2; }
    .ebtn:active, .xbtn:active { transform: scale(.94); }
    .check-main { display: flex; gap: 10px; align-items: flex-start; flex: 1; min-width: 0; }
    .pack-row {
      display: flex; align-items: center; gap: 6px;
      border-top: 1px solid #f3f4f6;
    }
    .pack-row:first-of-type { border-top: none; }
    .pack-row .pack-st { border-top: none; padding-left: 10px; flex: 1; width: auto; min-width: 0; }
    .page-head.c-teal { color: var(--accent); }
    .page-head.c-purple { color: #9040b2; }
    .page-head.c-orange { color: var(--orange); }
    .page-head.c-blue { color: #4a69bd; }
    .kicker { font-size: 12px; font-weight: 700; color: var(--muted); }
    .kicker.urgent { color: #ef4444; }
    .kicker.urgent::before {
      content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: #ef4444; margin-right: 6px; vertical-align: 1px;
    }
    .next { font-size: 22px; font-weight: 800; margin: 4px 0 6px; letter-spacing: -.02em; }
    .chip {
      display: inline-block; font-size: 11px; font-weight: 700;
      padding: 3px 9px; border-radius: 99px; margin-right: 4px;
    }
    .chip-komodo { background: #d1fae5; color: var(--komodo); }
    .chip-bali { background: #fff3e6; color: var(--bali); }
    .chip-java { background: #dcfce7; color: #15803d; }
    .chip-transit { background: #f3e8ff; color: #7c3aed; }
    .chip-skip { background: #fff3e6; color: var(--orange); }
    .chip-must { background: #d1fae5; color: var(--ok); }
    .chip-ok { background: #d1fae5; color: #047857; }
    .chip-wait { background: #fff7ed; color: #c2410c; }
    .chip-canceling { background: #ffe4e6; color: #be123c; }
    .chip-off { background: #f3f4f6; color: #6b7280; }
    .warn {
      background: #fff7ed; color: #9a3412; border-radius: 10px;
      padding: 10px 12px; font-size: 13px; margin-top: 8px;
    }
    .callout {
      background: #fff7e8; color: #c2410c; border-radius: 10px;
      padding: 8px 10px; font-size: 12px; margin-top: 8px; font-weight: 600;
    }
    .row {
      display: grid; grid-template-columns: 52px 1fr;
      gap: 8px; padding: 10px 0; border-top: 1px solid #f3f4f6;
    }
    .row:first-of-type { border-top: none; }
    .t { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); padding-top: 2px; }
    .title { font-weight: 700; font-size: 15px; }
    .note { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .hl { color: var(--orange); }
    .memo { color: var(--ok); }
    .day-btn {
      width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 12px 14px; margin-bottom: 8px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 1px 3px rgba(16,24,40,.04);
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }
    .day-btn:active { transform: scale(.985); }
    .day-btn .d {
      font-weight: 800; min-width: 48px; font-size: 12px; color: #fff;
      text-align: center; border-radius: 10px; padding: 8px 6px; line-height: 1.2;
    }
    .day-btn.ph-komodo .d { background: var(--komodo); }
    .day-btn.ph-bali .d { background: var(--bali); }
    .day-btn.ph-java .d { background: var(--java); }
    .day-btn.ph-transit .d { background: var(--purple); }
    .day-btn .ttl { flex: 1; font-weight: 700; font-size: 14px; }
    .filters { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 12px; }
    .filters button {
      border: 1px solid var(--line); background: #fff; color: #4b5563;
      border-radius: 99px; padding: 6px 14px; font-size: 12px; font-weight: 650; white-space: nowrap;
      transition: background .18s ease, color .18s ease, border-color .18s ease, transform .15s ease;
    }
    .filters button:active { transform: scale(.96); }
    .filters button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .subchrome {
      position: sticky;
      top: var(--header-h, 72px);
      z-index: 1900;
      isolation: isolate;
      margin: -14px -14px 12px;
      padding: 8px 14px 10px;
      background: rgba(245,246,248,.96);
      backdrop-filter: blur(12px);
    }
    .subchrome[hidden] { display: none !important; }
    .subnav {
      display: grid; gap: 6px;
      margin: 0; padding: 0;
      position: static;
      background: none;
    }
    .subnav.n4 { grid-template-columns: repeat(4, 1fr); }
    .subnav.n3 { grid-template-columns: repeat(3, 1fr); }
    .subnav.n2 { grid-template-columns: repeat(2, 1fr); }
    .subnav button {
      border: 0; background: #fff; color: #6b7280;
      border-radius: 12px; padding: 8px 4px; font-size: 13px; font-weight: 650;
      border: 1px solid var(--line);
      transition: background .2s ease, color .2s ease, border-color .2s ease, transform .15s ease;
    }
    .subnav button:active { transform: scale(.96); }
    .subnav button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .jumps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tap {
      color: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: color-mix(in srgb, currentColor 45%, transparent);
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .15s ease;
    }
    .tap:active { opacity: .55; }
    .hl-flash { animation: hlflash 1.4s ease; }
    #page-trip .item, #page-trip .card {
      scroll-margin-top: calc(var(--header-h, 72px) + 58px);
    }
    @keyframes hlflash {
      0%, 100% { background: #fff; }
      25% { background: #ccfbf1; }
    }
    .check { display: flex; gap: 8px; align-items: flex-start; padding: 11px 0; border-top: 1px solid #f3f4f6; }
    .check:first-of-type { border-top: none; }
    .check input {
      appearance: none; -webkit-appearance: none;
      margin-top: 2px; width: 18px; height: 18px; flex-shrink: 0;
      border: 1.6px solid #d1d5db; border-radius: 5px; background: #fff;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }
    .check input:checked {
      background: var(--accent); border-color: var(--accent);
      transform: scale(1.06);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' d='M3.5 8.2l3 3 6-6.4'/></svg>");
      background-size: 12px; background-repeat: no-repeat; background-position: center;
    }
    .check .lab { transition: color .16s ease; }
    .check.done .lab { color: var(--muted); text-decoration: line-through; }
    .pack-st {
      display: flex; gap: 10px; align-items: center;
      width: 100%; text-align: left;
      background: none; border: 0; border-top: 1px solid #f3f4f6;
      padding: 11px 0 11px 10px; font: inherit; color: inherit;
      position: relative;
      transition: background .15s ease, transform .15s ease;
    }
    .pack-st:not(:disabled):active { transform: scale(.99); background: #f8faf9; }
    .pack-st:first-of-type { border-top: none; }
    .pack-st:disabled { opacity: 1; cursor: default; }
    .pack-st:not(:disabled) { cursor: pointer; }
    .pack-st .lab { flex: 1; font-weight: 700; font-size: 14px; }
    .pack-st::before {
      content: ""; position: absolute; left: 0; top: 10px; bottom: 10px;
      width: 4px; border-radius: 4px;
    }
    .st-none::before { background: var(--orange); }
    .st-have::before { background: var(--blue); }
    .st-packed::before { background: var(--accent); }
    .st-pill {
      flex-shrink: 0; font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 99px; min-width: 52px; text-align: center;
      transition: background .18s ease, color .18s ease;
    }
    .st-none .st-pill { background: #fff3e6; color: var(--orange); }
    .st-have .st-pill { background: #dbeafe; color: #1d4ed8; }
    .st-packed .st-pill { background: #d1fae5; color: #047857; }
    .st-packed .lab { color: var(--muted); text-decoration: line-through; }
    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 4px;
    }
    .stat {
      background: #fff; border: 1px solid var(--line); border-radius: 14px;
      padding: 12px 8px; text-align: center;
    }
    .stat b { display: block; font-size: 22px; font-weight: 800; line-height: 1.1; }
    .stat span { font-size: 11px; color: var(--muted); }
    .stat.miss b { color: var(--orange); }
    .stat.have b { color: var(--blue); }
    .stat.ok b { color: var(--accent); }
    .prog { margin: 8px 0 4px; }
    .prog-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .prog-top b { color: var(--accent); }
    .prog-bar { height: 8px; background: #d1fae5; border-radius: 99px; overflow: hidden; }
    .prog-bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s ease; }
    .add-box .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .add-box .pair .field { margin-bottom: 8px; }
    .spend-row {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 11px 0; border-top: 1px solid #f3f4f6;
    }
    .spend-row:first-of-type { border-top: none; }
    .spend-row .lab { flex: 1; min-width: 0; }
    .spend-row .lab b { display: block; font-size: 14px; font-weight: 700; }
    .spend-amt { font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; text-align: right; }
    .spend-amt.wait { color: var(--orange); font-weight: 700; font-size: 13px; }
    .spend-sum {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 10px; padding: 8px 0 2px; font-size: 13px;
    }
    .spend-sum span { color: var(--muted); }
    .spend-bar {
      display: flex; height: 8px; background: #eef2f1; border-radius: 99px;
      overflow: hidden; margin-top: 6px;
    }
    .spend-bar i { display: block; height: 100%; flex: none; background: var(--accent); }
    .spend-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 5px; vertical-align: 1px;
    }
    .spend-legend {
      display: flex; flex-wrap: wrap; gap: 6px 12px;
      margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
      font-size: 11px; color: var(--muted);
    }
    textarea {
      width: 100%; min-height: 88px; border: 1px solid var(--line); border-radius: 12px;
      padding: 10px; font: inherit; resize: none; background: #fafafa;
      overflow: hidden; field-sizing: content;
    }
    .hint { font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
    .btn {
      border: 0; background: var(--accent); color: #fff; border-radius: 10px;
      padding: 9px 12px; font: inherit; font-weight: 700; font-size: 13px;
      transition: transform .15s ease, filter .15s ease, background .18s ease;
    }
    .btn:active { transform: scale(.97); filter: brightness(.94); }
    .btn.sec { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
    .btn:disabled { opacity: .45; }
    .ghost, a.ghost {
      display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid var(--accent); color: var(--accent); background: #fff;
      border-radius: 8px; padding: 3px 8px; font-size: 11px; font-weight: 700;
      text-decoration: none; flex-shrink: 0; line-height: 1.2;
      -webkit-tap-highlight-color: transparent;
    }
    a.ghost:active { filter: brightness(.94); }
    .title .ghost { margin-left: 6px; vertical-align: 1px; }
    .ghost .ico-ext { width: 9px; height: 9px; margin-left: 1px; }
    .wrap.swiping a.jump-ext { pointer-events: none; }
    .field {
      width: 100%; border: 1px solid var(--line); border-radius: 10px;
      padding: 9px 10px; font: inherit; background: #fafafa; margin-bottom: 8px;
    }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .okline { font-size: 12px; color: var(--ok); }
    .err { font-size: 12px; color: #dc2626; margin-top: 4px; }
    .gate-card { padding: 10px 12px; }
    .gate-card .kicker { font-size: 10px; }
    .gate-card .field { padding: 7px 9px; margin-bottom: 6px; }
    .gate-card .hint { margin: 4px 0 6px; }
    .gate-card .btn { padding: 7px 10px; font-size: 12px; }
    .gate-card .okline { margin-top: 4px; }
    nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 2100;
      display: grid; grid-template-columns: repeat(4, 1fr);
      background: #fff; border-top: 1px solid var(--line);
      padding: 6px 0 calc(6px + var(--safe));
    }
    nav button {
      border: 0; background: none; padding: 4px 0 2px;
      font-size: 10px; color: #9ca3af; font-weight: 650;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      transition: color .2s ease, transform .15s ease;
    }
    nav button svg { width: 22px; height: 22px; transition: transform .18s ease; }
    nav button:active { transform: scale(.92); }
    nav button.on { color: var(--accent); }
    nav button.on svg { transform: scale(1.08); }
    .page { display: none; position: relative; z-index: 0; }
    .page.on { display: block; overflow-x: hidden; }
    .day-card { display: none; }
    .day-card.open { display: block; animation: dayOpen .22s ease; }
    @keyframes dayOpen { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    .fx-row {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line);
      font-size: 15px;
    }
    .fx-row:last-of-type { border-bottom: 0; }
    .fx-row span { color: var(--muted); }
    .fx-row b { font-size: 16px; font-weight: 800; letter-spacing: -.02em; }
    #fx-card a { color: var(--muted); }
    .tz-shift {
      font-size: 13px; line-height: 1.5;
      padding: 8px 0 0; margin-top: 8px; border-top: 1px solid var(--line);
    }
    .callout.tz-note { background: #eef2ff; color: #4338ca; }
    .item {
      position: relative; overflow: hidden;
      background: #fff; border: 1px solid var(--line); border-radius: 16px;
      padding: 14px 14px 12px 16px; margin: 0 0 10px;
      box-shadow: 0 1px 3px rgba(16,24,40,.04);
    }
    .item::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    }
    .item.ph-transit::before { background: var(--purple); }
    .item.ph-komodo::before { background: var(--komodo); }
    .item.ph-bali::before { background: var(--bali); }
    .item.ph-java::before { background: var(--java); }
    .item.st-cancel { color: #9ca3af; }
    .item.st-cancel::before { background: #9ca3af; }
    .item.st-cancel .stay-name,
    .item.st-cancel .stay-meta,
    .item.st-cancel .note,
    .item.st-cancel .stay-top,
    .item.st-cancel .ico { color: #9ca3af; }
    .item.st-cancel .ghost { border-color: #d1d5db; color: #9ca3af; }
    .item.st-canceling {
      background: #fad1d8;
      border-color: #f5b7c2;
    }
    .ticket-top, .stay-top {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .stay-actions { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .ticket-no { font-size: 13px; font-weight: 700; }
    .ticket-al { color: var(--muted); font-weight: 500; }
    .ticket-route {
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: 8px; margin: 10px 0 8px;
    }
    .ticket-time { font-size: 22px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .ticket-city { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .ticket-end.right { text-align: right; }
    .ticket-mid { color: var(--accent); text-align: center; min-width: 72px; }
    .ticket-mid svg { width: 18px; height: 18px; }
    .ticket-mid .dash {
      height: 0; border-top: 1.5px dashed #cbd5e1; margin-top: 4px;
    }
    .ticket-dur {
      font-size: 10px; color: var(--muted); font-weight: 500;
      margin-top: 4px; line-height: 1.2; white-space: nowrap;
    }
    .ticket-foot {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; font-size: 12px; color: var(--muted); margin-top: 4px;
    }
    .ticket-foot .bag { display: inline-flex; align-items: center; gap: 4px; }
    .stay-name { font-size: 16px; font-weight: 800; margin: 6px 0 4px; }
    .stay-meta { font-size: 13px; color: #4b5563; }
    .act-card { isolation: isolate; }
    .act-card::before { z-index: 3; }
    .act-photo {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: 92% 16%;
      pointer-events: none; z-index: 0;
      opacity: 0;
    }
    .act-photo.is-in { opacity: 1; transition: opacity .22s ease; }
    .act-card::after {
      content: "";
      position: absolute; inset: 0;
      z-index: 1; pointer-events: none;
      background: linear-gradient(
        54deg,
        #fff 0%,
        #fff 34%,
        rgba(255,255,255,.92) 42%,
        rgba(255,255,255,.62) 50%,
        rgba(255,255,255,.28) 58%,
        rgba(255,255,255,.08) 66%,
        transparent 76%
      );
    }
    .act-card .stay-top,
    .act-card .stay-name,
    .act-card .stay-meta,
    .act-card .note,
    .act-card .callout,
    .act-card .act-foot { position: relative; z-index: 2; }
    .act-card .callout {
      background: linear-gradient(
        to right,
        #fff7e8 0%,
        #fff7e8 46%,
        rgba(255,247,232,.55) 70%,

function mergeList(base, extra, gone, edits) {

    const e = patch[p.id];
    out.push(e ? Object.assign({}, p, e) : Object.assign({}, p));
  };
  (base || []).forEach(put);

}

function removeListItem(kind, id) {

  const L = ensureLists();
  if (kind === "prep") {
    L.gonePrep = Array.from(new Set(L.gonePrep.concat(id)));
    L.extraPrep = L.extraPrep.filter(p => p.id !== id);
    delete L.editPrep[id];
    if (cloud.prep) delete cloud.prep[id];
  } else if (kind === "pack") {
    L.gonePack = Array.from(new Set(L.gonePack.concat(id)));
    L.extraPack = L.extraPack.filter(p => p.id !== id);
    delete L.editPack[id];
    if (cloud.pack) delete cloud.pack[id];
  } else if (kind === "spend") {
    L.goneSpend = Array.from(new Set(L.goneSpend.concat(id)));

function todayISO() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
}
function readFxCache() {
  try { return JSON.parse(localStorage.getItem(KEY_FX) || "null"); }
  catch (e) { return null; }
}
function fxFresh(cache) {
  return !!(cache && cache.date === todayISO() && Number.isFinite(cache.cnyToIdr) && cache.cnyToIdr > 0);
}
async function fetchFx() {
  const r = await fetch(FX_API);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  const idr = j && j.rates ? Number(j.rates.IDR) : NaN;
  if (!j || j.result !== "success" || !Number.isFinite(idr) || idr <= 0) throw new Error("bad rates");
  const data = { date: todayISO(), cnyToIdr: idr, updated: j.time_last_update_utc || "" };
  localStorage.setItem(KEY_FX, JSON.stringify(data));
  return data;
}
async function loadFx() {
  const cached = readFxCache();
  if (fxFresh(cached)) return cached;
  try {
    return await fetchFx();
  } catch (e) {
    if (cached && Number.isFinite(cached.cnyToIdr) && cached.cnyToIdr > 0) {
      cached.stale = true;
      return cached;
    }
    throw e;
  }
}

function parseISO(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); }
function diffDays(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }

function currentDay() {
  const iso = todayISO();
  const found = days.find(d => d.iso === iso);
  if (found) return { mode:"during", day: found };
  if (iso < days[0].iso) return { mode:"before", day: days[0], left: diffDays(iso, days[0].iso) };
  return { mode:"after", day: days[days.length - 1] };
}

function nextEvent(day) {
  if (!day) return null;
  const now = new Date();
  const iso = todayISO();
  if (day.iso !== iso) return day.events[0];
  const hm = now.getHours()*60 + now.getMinutes();
  for (const e of day.events) {
    if (!/^\d{1,2}:\d{2}$/.test(e.t)) continue;
    const [h,m] = e.t.split(":").map(Number);
    if (h*60 + m >= hm - 20) return e;
  }
  return day.events[day.events.length - 1];
}

  const pairs = [];
  flights.forEach(f => pairs.push({ key: f.no, jump: "flights", id: "f-"+f.no }));
  acts.forEach((a,i) => {
    [a.name, ...(a.aka || [])].forEach(key => pairs.push({ key, jump: "acts", id: "a-"+i }));
  });
  hotels.forEach((h,i) => {
    const short = h.name.replace(/（.*）/, "").trim();
    [h.name, short, ...(h.aka || [])].forEach(key => pairs.push({ key, jump: "hotels", id: "h-"+i }));
  });
  const seen = new Set();
  return pairs
    .filter(p => p.key && !seen.has(p.key) && seen.add(p.key))
    .sort((a,b) => b.key.length - a.key.length);
}
function linkText(s) {
  const out = s || "";
  const hits = [];
  linkKeys().forEach(p => {
    let from = 0;
    while (from < out.length) {
      const i = out.indexOf(p.key, from);
      if (i < 0) break;
      hits.push({ i, j: i + p.key.length, p, len: p.key.length });
      from = i + p.key.length;
    }
  });
  hits.sort((a,b) => b.len - a.len || a.i - b.i);
  const used = [];
  hits.forEach(h => {
    if (used.some(u => h.i < u.j && u.i < h.j)) return;
    used.push(h);
  });
  used.sort((a,b) => a.i - b.i);
  let res = "", cur = 0;
  used.forEach(h => {
    res += out.slice(cur, h.i) + tap(out.slice(h.i, h.j), h.p.jump, h.p.id);
    cur = h.j;
  });
  return res + out.slice(cur);
}

function md(s) {
  const m = String(s).match(/(\d{1,2})\.(\d{1,2})/);
  return m ? Number(m[1]) * 100 + Number(m[2]) : 0;
}
function hotelOnDay(h, d) {
  const x = md(d.date);
  return md(h.inn) <= x && x < md(h.out);
}
function actOnDay(a, d) {
  const keys = String(a.date).match(/(\d{1,2})\.(\d{1,2})/g) || [];
  const x = md(d.date);
  if (keys.length >= 2) return md(keys[0]) <= x && x <= md(keys[1]);
  return keys.some(k => md(k) === x);
}
function dayIndexForDate(s) {
  const k = md(s);
  const i = days.findIndex(d => md(d.date) === k);
  return i < 0 ? 0 : i;
}

function vfUrl(f) {

const AIRPORT_UTC = { PKX:8, SGN:7, KUL:8, LBJ:8, DPS:8, SUB:7 };
function hmToMin(s) {
  const [h, m] = String(s).split(":").map(Number);
  return h * 60 + m;
}
function flightDur(f) {
  const depOff = AIRPORT_UTC[f.from];
  const arrOff = AIRPORT_UTC[f.to];
  if (depOff == null || arrOff == null) return "";
  let mins = (hmToMin(f.arr) - arrOff * 60) - (hmToMin(f.dep) - depOff * 60);
  if (mins <= 0) mins += 24 * 60;
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? h + "小时" + m + "分" : h + "小时";
}

}

function reducedMotion() {
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

let paneBusy = false;
function paneTarget(box) {
  return (box && box.querySelector(":scope > .pane-body")) || box;
}
function fillPane(box, html) {
  box.innerHTML = '<div class="pane-body">' + html + "</div>";
}
function clearPaneStyle(el) {
  if (!el) return;
  el.style.transition = "";
  el.style.transform = "";
  el.style.opacity = "";
}
function switchPane(box, dir, after) {
  if (!box || reducedMotion()) {
    after();
    return;
  }
  if (paneBusy) return;
  paneBusy = true;
  const body = paneTarget(box);
  const outX = dir >= 0 ? "-28px" : "28px";
  const inX = dir >= 0 ? "28px" : "-28px";
  const playIn = () => {
    after();
    const next = paneTarget(box);
    next.style.transition = "none";
    next.style.transform = "translate3d(" + inX + ",0,0)";
    next.style.opacity = "0";
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        next.style.transition = "transform .26s cubic-bezier(.22,.8,.36,1), opacity .22s ease";
        next.style.transform = "translate3d(0,0,0)";
        next.style.opacity = "1";
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          clearPaneStyle(next);
          paneBusy = false;
        };
        next.addEventListener("transitionend", function te(e) {
          if (e.target !== next || e.propertyName !== "transform") return;
          next.removeEventListener("transitionend", te);
          finish();
        });
        setTimeout(finish, 340);
      });
    });
  };
  if (body.style.transform) {
    playIn();
    return;
  }
  body.style.transition = "transform .14s ease, opacity .14s ease";
  body.style.transform = "translate3d(" + outX + ",0,0)";
  body.style.opacity = "0";
  setTimeout(playIn, 140);
}
function switchTripTab(id, dir) {

  const ids = TRIP_TABS.map(t => t.id);
  if (dir == null) dir = ids.indexOf(id) >= ids.indexOf(tripTab) ? 1 : -1;

function regionPoints(key) {
  const hs = ph => mappedHotels().filter(h => phaseForDate(h.inn) === ph).map(h => [h.lat, h.lng]);
  if (key === "komodo") {
    return [
      stops.find(s => s.id === 3),

  }
  if (key === "bali") return stops.filter(s => s.phase === "bali" || s.name === "Gilimanuk").map(s => [s.lat, s.lng]).concat(hs("bali"));
  if (key === "java") return stops.filter(s => s.phase === "java").map(s => [s.lat, s.lng]).concat(hs("java"));
  return [];

function focusRegion(key) {

    if (!mapObj) return;
    const pts = regionPoints(key);
    if (!pts.length) return;
    mapObj.flyToBounds(L.latLngBounds(pts).pad(0.22), { duration: 0.7 });
  };
  if (!mapObj) setTimeout(run, 160);
  else run();
}
function initMap() {
  const el = document.getElementById("map");
  if (!el || typeof L === "undefined") return;
  if (mapObj) { mapObj.invalidateSize(); return; }
  mapObj = L.map(el, { zoomControl:true, scrollWheelZoom:true }).setView([-8.3, 115.2], 7);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution:"&copy; OpenStreetMap", maxZoom:19 }).addTo(mapObj);
  stops.forEach((s,i) => {
    L.marker([s.lat, s.lng], { icon: L.divIcon({ className:"", html:`<div class="marker-num" style="background:${PHASE_COLOR[s.phase]}">${i+1}</div>`, iconSize:[26,26], iconAnchor:[13,13] }) })
      .addTo(mapObj)
      .bindPopup(`<b>${s.name}</b><br>${s.date}<br>${s.desc}`);
  });
  function draw(from, to, type) {
    const a = stops.find(x=>x.id===from), b = stops.find(x=>x.id===to);
    if (!a || !b) return;
    L.polyline([[a.lat,a.lng],[b.lat,b.lng]], {
      color: type==="flight" ? "#8b5cf6" : (PHASE_COLOR[b.phase]||"#0f766e"),
      weight: type==="flight"?2:3, dashArray: type==="flight"?"8 6":null, opacity:.75
    }).addTo(mapObj);
  }
  flightSegs.forEach(([f,t]) => draw(f,t,"flight"));
  groundSegs.forEach(([f,t]) => draw(f,t,"ground"));
  addBoatRoute(boatHalf, "#0f766e", "9.27 科莫多半日游");
  addBoatRoute(boatDay, "#14b8a6", "9.28 科莫多一日跳岛");
  addHotelMarkers();
  mapObj.fitBounds(L.latLngBounds(stops.filter(s=>s.phase!=="transit"||s.name==="Gilimanuk").map(s=>[s.lat,s.lng])).pad(.12));
}

const CLOUD_API = "https://api.textdb.online";
const CLOUD_READ = "https://textdb.online";

function sid() {
  const q = new URLSearchParams(location.search).get("sid");
  return (q || localStorage.getItem(KEY_SID) || "").trim();
}
function isTextDbSid(id) { return /^td[a-f0-9]{16}$/i.test(id || ""); }
function who() { return localStorage.getItem(KEY_WHO) || ""; }
function newCloudKey() {
  const bytes = new Uint8Array(8);
  crypto.getRandomValues(bytes);
  return "td" + [...bytes].map(b => b.toString(16).padStart(2, "0")).join("");
}
function syncFailHint(e) {
  const raw = (e && e.message) ? e.message : String(e);
  return raw + "。若仍打不开，把这句原样发给我换存储。";
}
function emptyCloud() {
  return { prep: {}, pack: {}, notes: "", pinHash: "", updatedAt: "", by: "", lists: emptyLists() };
}
function cloudPayload() {
  ensureLists();
  return {
    prep: cloud.prep && typeof cloud.prep === "object" ? cloud.prep : {},
    pack: cloud.pack && typeof cloud.pack === "object" ? cloud.pack : {},
    notes: cloud.notes || "",
    pinHash: cloud.pinHash || "",
    updatedAt: cloud.updatedAt || "",
    by: cloud.by || "",
    lists: cloud.lists
  };
}
function stampOf(c) {
  const t = Date.parse(c && c.updatedAt ? c.updatedAt : "");
  return Number.isFinite(t) ? t : 0;
}
function fmtSyncTime(iso) {
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return "";
  const parts = new Intl.DateTimeFormat("zh-CN", {
    timeZone: "Asia/Shanghai",
    year: "numeric", month: "numeric", day: "numeric",
    hour: "2-digit", minute: "2-digit", hour12: false
  }).formatToParts(new Date(t));
  const g = Object.fromEntries(parts.filter(p => p.type !== "literal").map(p => [p.type, p.value]));
  return `${g.year}.${Number(g.month)}.${Number(g.day)} ${String(g.hour).padStart(2,"0")}:${String(g.minute).padStart(2,"0")}`;
}
function saveDraft() {
  try {
    localStorage.setItem(KEY_DRAFT, JSON.stringify({
      sid: sid() || "",
      savedAt: Date.now(),
      cloud: cloudPayload()
    }));
  } catch (e) {}
}
function loadDraft() {
  try { return JSON.parse(localStorage.getItem(KEY_DRAFT) || "null"); }
  catch (e) { return null; }
}
function applyCloud(data) {
  const base = emptyCloud();
  const src = data && typeof data === "object" ? data : {};
  cloud = {
    prep: src.prep && typeof src.prep === "object" ? src.prep : base.prep,
    pack: src.pack && typeof src.pack === "object" ? src.pack : base.pack,
    notes: typeof src.notes === "string" ? src.notes : "",
    pinHash: src.pinHash || "",
    updatedAt: src.updatedAt || "",
    by: src.by || "",
    lists: src.lists && typeof src.lists === "object" ? src.lists : base.lists
  };
  ensureLists();
}

async function hashPin(pin) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("island-volcano-2026|" + pin));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function setSid(id) {
  localStorage.setItem(KEY_SID, id);
  const u = new URL(location.href);
  u.searchParams.set("sid", id);
  history.replaceState({}, "", u);
}

function clearSid() {
  localStorage.removeItem(KEY_SID);
  sessionStorage.removeItem(KEY_UNLOCK);
  canEdit = false;
  applyCloud(emptyCloud());
  dirty = false;
  try { localStorage.removeItem(KEY_DRAFT); } catch (e) {}
  const u = new URL(location.href);
  u.searchParams.delete("sid");
  history.replaceState({}, "", u);
}

async function cloudFetch(url, opts) {
  const next = Object.assign({ cache: "no-store" }, opts || {});
  try {
    return await fetch(url, next);
  } catch (e) {
    const raw = (e && e.message) ? e.message : String(e);
    throw new Error(raw + " @ " + url.split("?")[0]);
  }
}

async function writeCloud(id, data) {
  const body = new URLSearchParams();
  body.set("key", id);
  body.set("value", JSON.stringify(data));
  const r = await cloudFetch(CLOUD_API + "/update/", { method: "POST", body });
  if (!r.ok) throw new Error("保存失败 HTTP " + r.status + " @ " + CLOUD_API);
  let j = {};
  try { j = await r.json(); } catch (e) { throw new Error("保存失败：返回不是 JSON @ " + CLOUD_API); }
  if (!j || j.status !== 1) throw new Error("保存失败 " + ((j && (j.info || j.msg)) || JSON.stringify(j)) + " @ " + CLOUD_API);
}

async function readCloudText(id) {
  const urls = [
    CLOUD_READ + "/" + encodeURIComponent(id) + "?_=" + Date.now(),
    CLOUD_API + "/" + encodeURIComponent(id) + "?_=" + Date.now()
  ];
  let lastErr = null;
  for (const url of urls) {
    try {
      const r = await cloudFetch(url);
      if (!r.ok) { lastErr = new Error("读取失败 HTTP " + r.status + " @ " + CLOUD_API); continue; }
      const text = ((await r.text()) || "").trim();
      if (text) return text;
      lastErr = new Error("云端还没有这份数据，请重新创建共享 @ " + CLOUD_API);
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("读取失败 @ " + CLOUD_API);
}

async function pullCloud() {
  const id = sid();
  if (!id) return false;
  if (!isTextDbSid(id)) throw new Error("旧同步通道 jsonblob 国内打不开，请点「重新创建共享」");
  const text = await readCloudText(id);
  let data;
  try { data = JSON.parse(text); }
  catch (e) { throw new Error("云端数据损坏 @ " + CLOUD_API); }
  if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("云端数据损坏 @ " + CLOUD_API);
  applyCloud(data);
  return true;
}

async function pushCloud() {
  const id = sid();
  if (!id) return false;
  if (!isTextDbSid(id)) throw new Error("旧同步通道 jsonblob 国内打不开，请点「重新创建共享」");
  cloud.updatedAt = new Date().toISOString();
  cloud.by = who() || "同伴";
  await writeCloud(id, cloudPayload());
  return true;
}

async function createCloud() {
  const seeded = seedDefaults();
  const id = newCloudKey();
  ensureLists();
  applyCloud({
    prep: Object.assign({}, seeded.prep, cloud.prep || {}),
    pack: Object.assign({}, seeded.pack, cloud.pack || {}),
    notes: cloud.notes || "",
    pinHash: cloud.pinHash || "",
    updatedAt: new Date().toISOString(),
    by: who() || "同伴",
    lists: cloud.lists
  });
  await writeCloud(id, cloudPayload());
  setSid(id);
  dirty = false;
  saveDraft();
}

function shareLink() {
  const u = new URL(location.href);
  if (sid()) u.searchParams.set("sid", sid());
  return u.toString();
}

function schedulePush() {
  dirty = true;
  saveDraft();
  renderSyncBits();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(runPush, 700);
}

async function runPush() {
  if (pushing) return;
  if (!dirty) return;
  if (!sid()) {
    saveDraft();
    renderSyncBits();
    return;
  }
  pushing = true;
  dirty = false;
  renderSyncBits();
  try {
    await pushCloud();
    saveDraft();
  } catch (err) {
    dirty = true;
    alert(err.message);
  } finally {
    pushing = false;
    renderSyncBits();
    if (dirty) saveTimer = setTimeout(runPush, 500);
  }
}

function renderSyncBits() {
  document.querySelectorAll("[data-sync]").forEach(el => {
    if (pushing) el.textContent = "正在保存到云端…";
    else if (dirty && sid()) el.textContent = "有改动待保存";
    else if (!sid()) el.textContent = "仅本机，换浏览器或清缓存会丢失";
    else if (cloud.updatedAt)
      el.textContent = `已同步 · ${cloud.by || "?"} ${fmtSyncTime(cloud.updatedAt)}`;
    else el.textContent = "还没有云端记录";
  });
}

function gateCard() {
  const id = sid();
  const legacy = id && !isTextDbSid(id);
  const connected = id && !legacy;
  const unlocked = canEdit

    : "";

  return `

        ${connected ? `<button class="btn sec" id="btnCopy">复制链接</button>` : ""}

function bindGate(box) {
  const err = (m) => { const el = box.querySelector("#syncErr"); if (el) el.textContent = m; };
  const afterUnlock = async () => {
    sessionStorage.setItem(KEY_UNLOCK, "1");
    canEdit = true;
    renderPrep();
  };
  const btnCreate = box.querySelector("#btnCreate");
  if (btnCreate) btnCreate.onclick = async () => {
    try {
      const pin = (box.querySelector("#pinBox").value || "").trim();
      if (pin.length < 4) return err("口令至少 4 位");
      await createCloud();
      canEdit = true;
      cloud.pinHash = await hashPin(pin);
      await pushCloud();
      await afterUnlock();
    } catch (e) { err(syncFailHint(e)); }
  };
  const btnReset = box.querySelector("#btnReset");
  if (btnReset) btnReset.onclick = () => {
    clearSid();
    renderPrep();
  };
  const btnUnlock = box.querySelector("#btnUnlock");
  if (btnUnlock) btnUnlock.onclick = async () => {
    try {
      const pin = (box.querySelector("#pinBox").value || "").trim();
      if (!pin) return err("输入口令");
      await pullCloud();
      const h = await hashPin(pin);
      if (cloud.pinHash && cloud.pinHash !== h) return err("口令不对");
      if (!cloud.pinHash) { cloud.pinHash = h; dirty = true; }
      const draft = loadDraft();
      if (draft && draft.sid === sid() && draft.cloud && stampOf(draft.cloud) > stampOf(cloud)) {
        const pinHash = cloud.pinHash;
        applyCloud(draft.cloud);
        cloud.pinHash = pinHash;
        dirty = true;
      }
      if (dirty) await runPush();
      await afterUnlock();
    } catch (e) { err(syncFailHint(e)); }
  };
  const btnLock = box.querySelector("#btnLock");
  if (btnLock) btnLock.onclick = () => {
    sessionStorage.removeItem(KEY_UNLOCK);
    canEdit = false;
    renderPrep();
  };
  const btnCopy = box.querySelector("#btnCopy");
  if (btnCopy) btnCopy.onclick = async () => {
    try { await navigator.clipboard.writeText(shareLink()); btnCopy.textContent = "已复制"; }
    catch { prompt("复制这个链接发给对方", shareLink()); }
  };
  renderSyncBits();
}

function openComposer(box, kind, item) {

  if (!form) return;
  form.hidden = false;
  form.dataset.mode = item ? "edit" : "add";
  form.dataset.id = item ? item.id : "";
  if (kind === "spend") {
    form.querySelector(".kicker").textContent = item ? "改花费" : "添加花费";
    form.querySelector("[data-add-save]").textContent = item ? "保存" : "添加";
    form.querySelector("[data-add-text]").value = item ? (item.name || "") : "";
    form.querySelector("[data-add-cat]").value = item ? (item.cat || "其他") : "其他";
    form.querySelector("[data-add-date]").value = item ? (item.date || "") : "";
    form.querySelector("[data-add-note]").value = item ? (item.note || "") : "";
    const idr = spendNum(item && item.idr);
    const cny = spendNum(item && item.cny);
    if (idr != null && cny == null) {
      form.querySelector("[data-add-cur]").value = "IDR";
      form.querySelector("[data-add-amt]").value = String(idr);
    } else {
      form.querySelector("[data-add-cur]").value = "CNY";
      form.querySelector("[data-add-amt]").value = cny != null ? String(cny) : "";
    }
  } else {
    form.querySelector(".kicker").textContent = item
      ? (kind === "prep" ? "改待办" : "改行李")
      : (kind === "prep" ? "添加待办" : "添加行李");
    form.querySelector("[data-add-save]").textContent = item ? "保存" : "添加";
    form.querySelector("[data-add-text]").value = item ? item.t : "";
    form.querySelector("[data-add-group]").value = item ? item.g : (kind === "prep" ? "自加" : "其他");
  }
  form.querySelector("[data-add-text]").focus();
  form.scrollIntoView({ behavior: "smooth", block: "center" });
}

function bindPrepActions(box) {
  box.querySelectorAll("[data-open-add]").forEach(btn => btn.onclick = () => {
    if (!canEdit) {
      box.querySelector("#pinBox")?.focus();
      return;
    }
    openComposer(box, btn.dataset.openAdd);
  });
  box.querySelectorAll("[data-add-cancel]").forEach(btn => btn.onclick = () => {
    const form = btn.closest("[data-composer]");
    if (form) form.hidden = true;
  });
  box.querySelectorAll("[data-add-save]").forEach(btn => btn.onclick = () => {
    if (!canEdit) return;
    const form = btn.closest("[data-composer]");

    if (kind === "spend") {
      const fields = spendFieldsFromForm(form);
      if (!fields.name) {
        form.querySelector("[data-add-text]").focus();
        return;
      }
      if (form.dataset.mode === "edit") patchSpendItem(form.dataset.id, fields);
      else addSpendItem(fields);
      renderPrep();
      schedulePush();
      return;
    }
    const t = form.querySelector("[data-add-text]").value;
    const g = form.querySelector("[data-add-group]").value;
    if (!(t || "").trim()) {
      form.querySelector("[data-add-text]").focus();
      return;
    }
    if (form.dataset.mode === "edit") renameListItem(kind, form.dataset.id, t, g);
    else addListItem(kind, t, g);
    renderPrep();
    schedulePush();
  });
  box.querySelectorAll("[data-add-text]").forEach(inp => inp.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      inp.closest("[data-composer]")?.querySelector("[data-add-save]")?.click();
    }
  }));
  box.querySelectorAll("[data-edit-prep]").forEach(btn => btn.onclick = e => {
    e.preventDefault();
    const item = livePrep().find(p => p.id === btn.dataset.editPrep);
    if (item) openComposer(box, "prep", item);
  });
  box.querySelectorAll("[data-edit-pack]").forEach(btn => btn.onclick = e => {
    e.preventDefault();
    const item = liveBags().find(p => p.id === btn.dataset.editPack);
    if (item) openComposer(box, "pack", item);
  });
  box.querySelectorAll("[data-del-prep]").forEach(btn => btn.onclick = e => {
    e.preventDefault();
    if (!confirm("删除这条待办？")) return;
    removeListItem("prep", btn.dataset.delPrep);
    renderPrep();
    schedulePush();
  });
  box.querySelectorAll("[data-del-pack]").forEach(btn => btn.onclick = e => {
    e.preventDefault();
    if (!confirm("删除这件行李？")) return;
    removeListItem("pack", btn.dataset.delPack);
    renderPrep();
    schedulePush();
  });
  box.querySelectorAll("[data-edit-spend]").forEach(btn => btn.onclick = e => {
    e.preventDefault();
    const item = liveSpend().find(p => p.id === btn.dataset.editSpend);
    if (item) openComposer(box, "spend", item);
  });
  box.querySelectorAll("[data-del-spend]").forEach(btn => btn.onclick = e => {
    e.preventDefault();
    if (!confirm("删除这条花费？统计会一起更新。")) return;
    removeListItem("spend", btn.dataset.delSpend);
    renderPrep();
    schedulePush();
  });
}

function fxUsedCnyToIdr(fx) {

function spendAmtHtml(item, fx) {

function spendColorMap(cats) {

}
function spendDot(color) {

}
function spendStatRows(groups, max, colorMap) {

function spendDateRows(groups, max, colorMap, catOrder) {

function spendLegend(cats, colorMap) {

    `<span>${spendDot(colorMap[cat] || SPEND_CUSTOM_COLORS[0])}${esc(cat)}</span>`
  ).join("")}</div>`;
}
function spendBodyHtml(fx) {
  const items = liveSpend();
  const known = items.filter(p => !spendPending(p));
  const waitN = items.length - known.length;
  const total = known.reduce((s, p) => s + (spendCny(p, fx) || 0), 0);
  const idrOnly = known.filter(p => spendNum(p.cny) == null && spendNum(p.idr) != null);
  const catOrder = [...SPEND_CATS, ...[...new Set(items.map(p => p.cat || "其他"))].filter(c => !SPEND_CATS.includes(c))];
  const byCat = catOrder.map(cat => {
    const rows = items.filter(p => (p.cat || "其他") === cat);
    if (!rows.length) return null;
    return {
      key: cat, label: cat,
      cny: rows.reduce((s, p) => s + (spendCny(p, fx) || 0), 0),
      wait: rows.filter(spendPending).length,
      n: rows.length
    };
  }).filter(Boolean);
  const colorMap = spendColorMap(catOrder);
  const dateMap = new Map();

    const key = spendDateKey(p.date);
    const cat = p.cat || "其他";
    const cur = dateMap.get(label) || { key, label, cny: 0, wait: 0, n: 0, parts: {} };
    const amt = spendCny(p, fx) || 0;
    cur.cny += amt;

    if (spendPending(p)) cur.wait += 1;
    cur.n += 1;
    dateMap.set(label, cur);
  });
  const byDate = [...dateMap.values()].sort((a, b) => a.key - b.key);
  const maxCat = Math.max(0, ...byCat.map(g => g.cny));
  const maxDate = Math.max(0, ...byDate.map(g => g.cny));
  const dateCats = catOrder.filter(cat => byDate.some(d => (d.parts[cat] || 0) > 0));
  const detail = catOrder.map(cat => {
    const rows = items.filter(p => (p.cat || "其他") === cat);
    if (!rows.length) return "";
    const sorted = rows.slice().sort((a, b) => spendDateKey(a.date) - spendDateKey(b.date));
    return `<div class="card">
      <div class="kicker">${esc(cat)} · ${rows.length}</div>
      ${sorted.map(p => `
        <div class="spend-row">
          <div class="lab">
            <b>${esc(p.name)}</b>
            <div class="note">${esc(spendDateLabel(p.date))}${p.note ? " · " + esc(p.note) : ""}</div>
          </div>
          ${spendAmtHtml(p, fx)}
          ${itemActions("spend", p.id)}
        </div>`).join("")}
    </div>`;
  }).join("");
  const fxHint = idrOnly.length
    ? (fx && fx.cnyToIdr ? `印尼盾按今日中间价折合（1 元 ≈ ${fmtIdr(fx.cnyToIdr)} 盾）。` : "印尼盾还没折上人民币，连上网络后会更新。")
    : "";
  return `
    <div class="page-head c-orange">花费 <span>${items.length} 笔</span>
      <button type="button" class="add-pill" data-open-add="spend">＋ 添加</button>
    </div>
    ${spendComposer()}
    <div class="stats">
      <div class="stat ok"><b>¥${fmtCny(total)}</b><span>已记账</span></div>
      <div class="stat miss"><b>${waitN}</b><span>待补</span></div>
      <div class="stat"><b>${items.length}</b><span>全部</span></div>
    </div>
    <p class="hint">${canEdit ? "点铅笔改类目、日期、金额，点 × 删除。改完统计立刻更新，并同步给对方。" : "先解锁才能增删改。"} 已退订的不列入。${fxHint}</p>
    <div class="card">
      <div class="kicker">按类目</div>
      ${spendStatRows(byCat, maxCat, colorMap)}
    </div>
    <div class="card">
      <div class="kicker">按日期</div>
      ${spendDateRows(byDate, maxDate, colorMap, catOrder)}
      ${spendLegend(dateCats, colorMap)}
    </div>
    ${detail}`;
}

function renderPrep() {
  const todos = livePrep();
  const packedItems = liveBags();
  const groups = [...new Set(todos.map(p=>p.g))];
  const bgroups = [...new Set(packedItems.map(p=>p.g))];
  const box = document.getElementById("page-prep");
  const left = todos.filter(p=>!isChecked("prep", p)).length;
  const noneN = packedItems.filter(p => packState(p) === "none").length;
  const packedN = packedItems.filter(p => packState(p) === "packed").length;
  const pct = todos.length ? Math.round((todos.length-left)/todos.length*100) : 0;
  paintSubnav("prep");
  const todoBody = `
    <div class="page-head c-blue">待办事项 <span>${todos.length} 条任务</span>
      <button type="button" class="add-pill" data-open-add="prep">＋ 添加</button>
    </div>
    ${addComposer("prep", groups.length ? groups : ["行前必办","按日期","自加"], "自加")}
    <div class="card">
      <div class="kicker">行前进度</div>
      <div class="prog">
        <div class="prog-top"><span>已完成 ${todos.length - left} / ${todos.length}</span><b>${pct}%</b></div>
        <div class="prog-bar"><i style="width:${pct}%"></i></div>
      </div>
      <p class="hint">${canEdit ? "勾选、添加、删除会立刻同步到云端。点铅笔可改文字。" : "先解锁才能勾选、添加或删除。已买行李额、已退 Seamount、已订烹饪课会显示完成。"}</p>
    </div>
    ${groups.map(g=>`
      <div class="card">
        <div class="kicker ${g==="行前必办"?"urgent":""}">${esc(g)}</div>
        ${todos.filter(p=>p.g===g).map(p=>`
          <div class="check ${isChecked("prep",p)?"done":""}">
            <label class="check-main">
              <input type="checkbox" data-list="prep" data-id="${p.id}" ${isChecked("prep",p)?"checked":""} ${canEdit?"":"disabled"}>
              <span class="lab">${esc(p.t)}</span>
            </label>
            ${itemActions("prep", p.id)}
          </div>`).join("")}
      </div>`).join("")}
    <div class="card">
      <div class="kicker">共享备忘</div>
      <p class="hint">${canEdit ? "两人看到的是同一份。不要写护照号、证件号。" : "解锁后可编辑。"}</p>
      <textarea id="noteBox" placeholder="潜店 WhatsApp、明早谁带口罩……" ${canEdit?"":"disabled"}></textarea>
    </div>
    <div class="card">
      <div class="kicker">签证与入境</div>
      <p class="note">印尼：需 e-VOA（2025年11月起对中国不免签），约 IDR 500,000/人，官网 molina.imigrasi.go.id</p>
      <p class="note" style="margin-top:6px">马来西亚：免签，出发前 72 小时内填 MDAC。</p>
      <p class="note" style="margin-top:6px">越南：胡志明中转不出机场无需签证；联程行李直挂。</p>
    </div>`;
  const packBody = `
    <div class="page-head c-teal">行李整理 <span>${packedItems.length} 件</span>
      <button type="button" class="add-pill" data-open-add="pack">＋ 添加</button>
    </div>
    ${addComposer("pack", bgroups.length ? bgroups : ["其他"], "其他")}
    <div class="stats">
      <div class="stat"><b>${packedItems.length}</b><span>全部</span></div>
      <div class="stat ok"><b>${packedN}</b><span>已装包</span></div>
      <div class="stat miss"><b>${noneN}</b><span>尚无</span></div>
    </div>
    <p class="hint">${canEdit ? "点一行切换：尚无 → 已有 → 已装包。点铅笔改名字，点 × 删除。改完会先记在本机，再写入云端。" : "先解锁才能改状态、添加或删除。依次是尚无、已有、已装包。"} 换酒店勤的日子：9.27、9.29、9.30、10.1、10.3、10.4、10.5、10.6。</p>
    ${bgroups.map(g=>`
      <div class="card">
        <div class="kicker">${esc(g)} · ${packedItems.filter(p=>p.g===g).length}</div>
        ${packedItems.filter(p=>p.g===g).map(p => {
          const st = packState(p);
          return `<div class="pack-row">
            <button type="button" class="pack-st st-${st}" data-pack="${p.id}" ${canEdit?"":"disabled"}>
              <span class="lab">${esc(p.t)}</span>
              <span class="st-pill">${PACK_LABEL[st]}</span>
            </button>
            ${itemActions("pack", p.id)}
          </div>`;
        }).join("")}
      </div>`).join("")}`;
  const spendBody = spendBodyHtml(readFxCache());
  const body = prepTab === "pack" ? packBody : (prepTab === "spend" ? spendBody : todoBody);
  fillPane(box, gateCard() + body);
  bindGate(box);
  bindPrepActions(box);
  box.querySelectorAll("input[type=checkbox]").forEach(inp => inp.onchange = () => {
    cloud.prep = cloud.prep || {};
    cloud.prep[inp.dataset.id] = inp.checked;
    renderPrep();
    schedulePush();
  });
  box.querySelectorAll("[data-pack]").forEach(btn => btn.onclick = () => {
    if (!canEdit) return;
    const id = btn.dataset.pack;
    const item = liveBags().find(p => p.id === id);
    setPackState(id, nextPackState(packState(item || { id, st: "none" })));
    renderPrep();
    schedulePush();
  });
  const ta = document.getElementById("noteBox");
  if (ta) {
    ta.value = cloud.notes || "";
    const fitNote = () => {
      ta.style.height = "auto";
      ta.style.height = Math.max(88, ta.scrollHeight) + "px";
    };
    ta.oninput = () => { cloud.notes = ta.value; fitNote(); schedulePush(); };
    requestAnimationFrame(fitNote);
  }
  if (prepTab === "spend") {
    const used = fxUsedCnyToIdr(readFxCache());
    loadFx().then(d => {
      if (prepTab !== "spend") return;
      if (document.activeElement && document.activeElement.closest("[data-composer]")) return;
      if (fxUsedCnyToIdr(d) !== used) renderPrep();
    }).catch(() => {});
  }
}

document.querySelectorAll("nav > button").forEach(btn => {
  btn.onclick = () => {
    showPage(btn.dataset.page);
    window.scrollTo(0,0);
  };
});

function syncHeaderH() {
  const h = document.querySelector("header")?.offsetHeight || 72;
  document.documentElement.style.setProperty("--header-h", h + "px");
}
function bindSwipe() {
  const wrap = document.querySelector("main.wrap");
  if (!wrap) return;
  let x0 = 0, y0 = 0, t0 = 0, tracking = false, dragging = false, swallowClick = false, swallowTimer = 0;
  const paneOn = () => paneTarget(document.querySelector(".page.on"));
  const resetDrag = el => {
    if (!el) return;
    el.style.transition = "transform .22s ease, opacity .22s ease";
    el.style.transform = "";
    el.style.opacity = "";
    setTimeout(() => { el.style.transition = ""; }, 240);
  };
  const armSwallow = () => {
    swallowClick = true;
    wrap.classList.add("swiping");
    clearTimeout(swallowTimer);
    swallowTimer = setTimeout(() => {
      swallowClick = false;
      wrap.classList.remove("swiping");
    }, 480);
  };
  wrap.addEventListener("click", e => {
    if (!swallowClick) return;
    if (e.target.closest("a.jump-ext")) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);
  wrap.addEventListener("touchstart", e => {
    if (paneBusy || e.touches.length !== 1) return;
    if (e.target.closest("textarea, input, select, .map-box, .filters, .add-box, .ebtn, .xbtn, .add-pill")) return;
    const on = document.querySelector(".page.on")?.id;
    if (on !== "page-trip" && on !== "page-prep") return;
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
    t0 = Date.now();
    tracking = true;
    dragging = false;
  }, { passive: true });
  wrap.addEventListener("touchmove", e => {
    if (!tracking || paneBusy) return;
    const t = e.touches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) < 14 || Math.abs(dx) < Math.abs(dy) * 1.15) return;
    if (!dragging) {
      dragging = true;
      wrap.classList.add("swiping");
    }
    const pane = paneOn();
    if (!pane || reducedMotion()) return;
    const w = pane.clientWidth || 1;
    pane.style.transition = "none";
    pane.style.transform = "translate3d(" + (dx * 0.42) + "px,0,0)";
    pane.style.opacity = String(Math.max(0.55, 1 - Math.abs(dx) / (w * 1.6)));
  }, { passive: true });
  wrap.addEventListener("touchend", e => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    const pane = paneOn();
    const on = document.querySelector(".page.on")?.id;
    const tabs = on === "page-trip" ? TRIP_TABS : (on === "page-prep" ? PREP_TABS : []);
    const cur = on === "page-trip" ? tripTab : prepTab;
    const i = tabs.findIndex(x => x.id === cur);
    const n = i + (dx < 0 ? 1 : -1);
    const commit = Date.now() - t0 < 800 && Math.abs(dx) >= 56 && Math.abs(dx) > Math.abs(dy) * 1.25 && n >= 0 && n < tabs.length;
    if (dragging) {
      if (e.cancelable) e.preventDefault();
      armSwallow();
    }
    if (!commit) {
      if (dragging) resetDrag(pane);
      dragging = false;
      return;
    }
    dragging = false;
    if (on === "page-trip") switchTripTab(tabs[n].id, dx < 0 ? 1 : -1);
    else switchPrepTab(tabs[n].id, dx < 0 ? 1 : -1);
  }, { passive: false });
  wrap.addEventListener("touchcancel", () => {
    if (!tracking && !dragging) return;
    tracking = false;
    if (dragging) {
      armSwallow();
      resetDrag(paneOn());
    }
    dragging = false;
  }, { passive: true });
}
syncHeaderH();
window.addEventListener("resize", syncHeaderH);
bindSwipe();

try { renderToday(); } catch (e) { document.getElementById("page-today").innerHTML = '<div class="card">今日页加载失败，请点「行程」查看。</div>'; }
try { renderTrip(); } catch (e) {}
requestAnimationFrame(preloadActPhotos);

async function bootSync() {
  bootError = "";
  const draft = loadDraft();
  const id = sid();
  if (id && isTextDbSid(id)) {
    localStorage.setItem(KEY_SID, id);
    try {
      await pullCloud();
      if (draft && (draft.sid || "") === id && draft.cloud && stampOf(draft.cloud) > stampOf(cloud)) {
        const pinHash = cloud.pinHash;
        applyCloud(draft.cloud);
        if (pinHash) cloud.pinHash = pinHash;
        dirty = true;
        schedulePush();
      } else {
        saveDraft();
      }
    } catch (e) {
      bootError = syncFailHint(e);
      if (draft && (draft.sid || "") === id && draft.cloud) applyCloud(draft.cloud);
    }
    if (sessionStorage.getItem(KEY_UNLOCK) === "1") canEdit = true;
  } else if (draft && !draft.sid && draft.cloud) {
    applyCloud(draft.cloud);
  }
}

(async () => {
  await bootSync();
  try { renderPrep(); } catch (e) {}
  setInterval(async () => {
    if (syncing || pushing || dirty || document.hidden || !isTextDbSid(sid())) return;
    const ae = document.activeElement;
    if (ae && (ae.id === "noteBox" || ae.closest("[data-composer]"))) return;
    syncing = true;
    try {
      const prev = JSON.stringify(cloudPayload());
      const prevStamp = stampOf(cloud);
      await pullCloud();
      if (dirty) {
        /* a local edit landed while we were reading; keep local */
      } else if (stampOf(cloud) !== prevStamp || JSON.stringify(cloudPayload()) !== prev) {
        saveDraft();
        renderPrep();
      }
    } catch (e) {}
    syncing = false;
  }, 8000);
})();

window.addEventListener("pagehide", () => {
  saveDraft();
  const id = sid();
  if (!id || !isTextDbSid(id) || !dirty || typeof navigator.sendBeacon !== "function") return;
  cloud.updatedAt = new Date().toISOString();
  cloud.by = who() || "同伴";
  const body = new URLSearchParams();
  body.set("key", id);
  body.set("value", JSON.stringify(cloudPayload()));
  try {
    navigator.sendBeacon(CLOUD_API + "/update/", new Blob([body.toString()], { type: "application/x-www-form-urlencoded" }));
    dirty = false;
  } catch (e) {}
});
</script>
